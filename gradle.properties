org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.x: gunakan JDK 17–21 untuk menjalankan Gradle. Jika error versi JDK (mis. 25.x), set:
# org.gradle.java.home=/path/ke/jdk17
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# URL backend OBill (harus diakhiri /). Default: contoh dari API_SELLER.md
# obill.api.base.url=https://sln.onesky.id/

# Endpoint checker update (GitLab API raw file latest-version.txt)
obill.update.check.url=https://gitrepo.aks-network.co.id/api/v4/projects/siribere%2Fobill_app_v2/repository/files/updates%2Flatest-version.txt/raw?ref=main

# Signing Play Store (opsional di sini, lebih aman simpan di local.properties / env vars)
# obill.playstore.storeFile=/ABSOLUTE/PATH/upload-keystore.jks
# obill.playstore.storePassword=***
# obill.playstore.keyAlias=***
# obill.playstore.keyPassword=***
